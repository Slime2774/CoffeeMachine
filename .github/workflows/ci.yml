name: .NET WPF CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-and-test: # <-- Переименовали джобу, чтобы было понятно, что она делает
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # Убрали continue-on-error, теперь падение тестов остановит пайплайн!
      # Также добавили Release, чтобы тесты запускались для той сборки, которую мы только что сделали
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet publish CoffeeVendingMachine/CoffeeVendingMachine.csproj -c Release -o ./publish

    - name: Upload artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: CoffeeVendingMachine
        path: ./publish